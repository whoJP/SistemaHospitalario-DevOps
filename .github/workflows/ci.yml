name: CI - Sistema Hospitalario

on:
  push:
    branches:
      - main
      - develop
      - feature/login
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos del proyecto
        run: |
          echo "Verificando estructura del proyecto..."
          test -f README.md
          echo "README.md encontrado correctamente"

      - name: Ejecutar prueba básica
        run: |
          echo "Ejecutando prueba básica..."
          echo "Sistema Hospitalario - CI funcionando correctamente"
          test -n "SistemaHospitalario-DevOps"
          echo "Prueba exitosa"